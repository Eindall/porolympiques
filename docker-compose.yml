# Production, sur le VPS : `docker compose up -d --build` (le script de déploiement s'en charge).
# Trois conteneurs : `db` (PostgreSQL dédié), `api` (NestJS, avec le bot), `web` (nginx : front et proxy /api).
# Seul `web` est joint au réseau de Caddy ; la base et l'API ne sont jamais exposées.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-porolympiques}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-porolympiques}
    volumes:
      - ${DB_DATA_DIR:-porolympiques-db}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-porolympiques}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-porolympiques}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      APP_URL: ${APP_URL:?APP_URL manquant dans .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID manquant dans .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET manquant dans .env}
      DISCORD_REDIRECT_URI: ${APP_URL}/api/auth/discord/callback
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN manquant dans .env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?DISCORD_GUILD_ID manquant dans .env}
      DISCORD_ADMIN_IDS: ${DISCORD_ADMIN_IDS:?DISCORD_ADMIN_IDS manquant dans .env}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:?TWITCH_CLIENT_ID manquant dans .env}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:?TWITCH_CLIENT_SECRET manquant dans .env}
      # Utilisée à partir de la phase 7 (annonces) : elle deviendra obligatoire à ce moment-là.
      DISCORD_ANNOUNCEMENTS_CHANNEL_ID: ${DISCORD_ANNOUNCEMENTS_CHANNEL_ID:-}
      UPLOADS_DIR: /data/uploads
    volumes:
      # Images des jeux saisis librement, envoyées par les joueurs.
      - ${UPLOADS_DATA_DIR:-porolympiques-uploads}:/data/uploads
    networks:
      default:
        aliases: [porolympiques-api]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      default: {}
      proxy:
        aliases: [porolympiques-web]

volumes:
  porolympiques-db:
  porolympiques-uploads:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?PROXY_NETWORK manquant dans .env}
